<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SALT</title>
    <link rel="stylesheet" href="css/Register.css">
</head>
<body>
    <!-- Navbar -->


    <!-- Contenido Principal -->
    <div class="main-container">
        <div class="register-card">
            <div class="register-header">
                <div class="register-icon"><i data-lucide="user-round"></i></div>
                <h2>Crear Cuenta</h2>
                <p>Completa el formulario para registrarte en el sistema</p>
            </div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombres" class="form-label">Nombres Completos</label>
                        <input type="text" class="form-control" id="nombres" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="tipoDocumento" class="form-label">Tipo de Documento</label>
                        <select class="form-select" id="tipoDocumento" required>
                            <option value="" selected disabled>Seleccione...</option>
                            <option value="CC">Cédula de Ciudadanía (CC)</option>
                            <option value="TI">Tarjeta de Identidad (TI)</option>
                            <option value="CE">Cédula de Extranjería (CE)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numeroDocumento" class="form-label">Número de Documento</label>
                        <input type="text" class="form-control" id="numeroDocumento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="lugarNacimiento" class="form-label">Lugar de Nacimiento</label>
                        <input type="text" class="form-control" id="lugarNacimiento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="passwordStrengthBar"></div>
                        </div>
                        <small style="color: var(--text-muted);">Mínimo 8 caracteres, incluyendo mayúsculas, números y símbolos</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="terminos" required>
                    <label class="form-check-label" for="terminos">
                        Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Registrarse</button>
                
                <a href="index.html" class="btn btn-outline">Volver al Inicio</a>

                <div class="login-link">
                    ¿Ya tienes cuenta? <a href="Login.html">Inicia Sesión</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 SALT - Sistema de Acceso Lector de Tarjetas. Todos los derechos reservados.</p>
    </footer>

    <script src="js/Register.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
