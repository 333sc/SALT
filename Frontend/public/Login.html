<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SALT</title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>
    <!-- Navbar -->
    

    <!-- Contenido Principal -->
    <div class="main-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon"><i data-lucide="log-in"></i></div>
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="cedula" class="form-label">User or ID Num</label>
                    <input type="text" class="form-control" id="cedula" placeholder="Ingresa tu número de documento" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="form-options">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label for="remember" class="form-label">Recordarme</label>
                    </div>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                
                <a href="index.html" class="btn btn-outline">Volver al Inicio</a>

                <div class="register-link">
                    ¿No tienes cuenta? <a href="Register.html">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </div>

    <!-- modal wrong info -->

    <div id="modal" class="modal hidden"> 
        <div class="modal-content">
            <span>Usuario o contraseña incorrectos</span>
            <div>icon</div>
            <span>close</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 SALT - Sistema de Acceso Lector de Tarjetas. Todos los derechos reservados.</p>
    </footer>

    <script src="js/login.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
